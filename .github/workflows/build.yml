name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Mfr.Protocol.Tests -c Release

  build:
    needs: [test]
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: MFR-Launcher-win-x64
            asset: MFR-Launcher-win-x64.exe
          - os: ubuntu-latest
            rid: linux-x64
            artifact: MFR-Launcher-linux-x64
            asset: MFR-Launcher-linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
            artifact: MFR-Launcher-linux-arm64
            asset: MFR-Launcher-linux-arm64
          - os: macos-latest
            rid: osx-x64
            artifact: MFR-Launcher-osx-x64
            asset: MFR-Launcher-osx-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: MFR-Launcher-osx-arm64
            asset: MFR-Launcher-osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: publish
        run: dotnet publish Mfr.Launcher -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: rename (bracket-free for gh)
        shell: bash
        run: |
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            mv publish/Mfr.Launcher.exe "publish/${{ matrix.asset }}"
          else
            mv publish/Mfr.Launcher "publish/${{ matrix.asset }}"
            chmod +x "publish/${{ matrix.asset }}"
          fi

      - name: addresses (production contour)
        shell: bash
        run: python3 -c "import json; data=json.load(open('addresses.json')); json.dump(data['production'], open('publish/launcher.json','w'), indent=2)" 2>/dev/null || cp addresses.json publish/

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: publish/${{ matrix.asset }}

      - name: release on tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "publish/${{ matrix.asset }}" --clobber || gh release create "${{ github.ref_name }}" --title "M[FR] Launcher ${{ github.ref_name }}" --generate-notes "publish/${{ matrix.asset }}"
