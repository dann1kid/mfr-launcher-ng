name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Mfr.Protocol.Tests -c Release
      - run: dotnet publish Mfr.Launcher -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: rename to a bracket-free asset name (gh glob-expands paths)
        run: Rename-Item publish/Mfr.Launcher.exe "MFR-Launcher.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: MFR-Launcher-win-x64
          path: publish/MFR-Launcher.exe
      - name: release on tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "M[FR] Launcher ${{ github.ref_name }}" --generate-notes publish/MFR-Launcher.exe
