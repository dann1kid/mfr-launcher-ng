# Конвейер клиента. Логика — в deploy/gitlab-ci/*.sh, любое падение
# воспроизводится локально той же командой. Merge request блокируют version,
# leak-scan и build:dotnet (сборка с -warnaserror и все тесты); на master
# добавляются publish:launcher и publish:tag.
#
# Исполнитель — машина сборки, которую заводят под конкретный прогон и
# удаляют после него. Задание уходит только исполнителю с тегом своего
# прогона, поэтому машина не берёт чужую работу. Именно IID: CI_PIPELINE_ID
# в tags не раскрывается, и задание ждало бы несуществующего исполнителя.
#
# Переменные конвейера (Settings → CI/CD → Variables) — в deploy/README.md.

workflow:
  rules:
    # Ветка проверяется своим merge request: прогон на голый пуш дал бы
    # вторую проверку той же работы.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"

stages:
  - check
  - build
  - publish

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # Образ заданий из своего реестра задаёт переменная проекта; без неё —
  # публичный SDK, и прогон качает его и пакеты сам.
  MFR_CI_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0

default:
  # Машина живёт один прогон, поэтому один образ на все задания: второй
  # образ — вторая загрузка на каждом прогоне.
  image: $MFR_CI_IMAGE
  tags:
    - pipeline-$CI_PIPELINE_IID
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure

# ── проверка (блокируют merge request) ──────────────────────────────

version:
  stage: check
  script: bash deploy/gitlab-ci/version-check.sh

leak-scan:
  stage: check
  script: bash deploy/gitlab-ci/leak-scan.sh

# ── сборка и тесты (блокирует merge request) ────────────────────────

build:dotnet:
  stage: build
  needs: []
  script: bash deploy/gitlab-ci/build-dotnet.sh
  artifacts:
    paths:
      - artifacts/launcher/
    expire_in: 30 days

# ── публикация (только master) ──────────────────────────────────────

publish:launcher:
  stage: publish
  interruptible: false
  needs: [version, leak-scan, build:dotnet]
  script: bash deploy/gitlab-ci/publish-launcher.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish:tag:
  stage: publish
  interruptible: false
  needs: [publish:launcher]
  script:
    - |
      VERSION=$(awk -F'<Version>' '/<Version>/ {split($2,a,"</Version>"); print a[1]; exit}' Directory.Build.props)
      if [[ "$VERSION" == *-SNAPSHOT ]]; then
        echo "снапшот — метка не ставится"
        exit 0
      fi
      TAG="v$VERSION"
      if git rev-parse "$TAG" >/dev/null 2>&1; then
        echo "метка $TAG уже существует"
        exit 0
      fi
      git tag "$TAG" "$CI_COMMIT_SHA"
      git push "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$TAG"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── ручное: образ заданий ───────────────────────────────────────────

image:ci:
  stage: publish
  # Образу нужен клиент Docker, а не SDK. Docker — сокет машины сборки:
  # привилегированного режима у неё нет.
  image: $MFR_CI_DOCKER_IMAGE
  needs: []
  interruptible: false
  variables:
    MFR_CI_IMAGE_TAG: "sdk10-$CI_PIPELINE_IID"
  script:
    - deploy/docker/build-ci-image.sh --push
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: manual
      allow_failure: true
