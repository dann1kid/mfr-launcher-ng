syntax = "proto3";

package com.lezenford.mfr.version.v1;


message Version {
  string id = 1;
  repeated File files = 2;
}

message File {
  string path = 1;
  string storage = 2;
  // Объект с gzip-копией того же файла. Есть не у каждого файла: копия
  // публикуется только там, где она заметно меньше оригинала.
  optional string compressed_storage = 3;
}
